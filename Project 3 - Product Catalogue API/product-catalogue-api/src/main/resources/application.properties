spring.application.name=product-catalogue-api

spring.datasource.url=jdbc:mysql://localhost:3306/products_db

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
# It tells Hibernate what to do with your database tables when the app starts, comparing
# your @Entity classes with the actual tables

spring.jpa.show-sql=true

spring.config.import=optional:file:.env[.properties],optional:file:product-catalogue-api/.env[.properties]

logging.level.org.springframework=debug

spring.devtools.restart.enabled=true